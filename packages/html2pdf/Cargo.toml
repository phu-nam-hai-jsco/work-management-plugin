[package]
name = "html2pdf"
version = "1.0.0"
edition = "2021"
description = "Sidecar CLI tien xu ly hoa don dien tu HTML va goi WeasyPrint xuat PDF"

[dependencies]
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
