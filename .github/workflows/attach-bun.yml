name: Đính kèm Bun (Windows + Linux x64)

# Tải bản phát hành Bun (Windows x64 + Linux x64, bản chuẩn + baseline), giải nén,
# đính vào release của plugin và ghi vào manifest.json để app desktop kéo về.

on:
  workflow_dispatch:
    inputs:
      bun-version:
        description: "Phiên bản Bun: 'latest' hoặc số phiên bản (vd 1.4.4)"
        default: "1.4.4"
        required: false
      release-tag:
        description: "Tag release của plugin để đính kèm (bỏ trống = releaseTag trong manifest.json)"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: attach-bun
  cancel-in-progress: false

env:
  BUN_DOWNLOAD_URL: https://pub-5e11e972747a44bf9aaf9394f185a982.r2.dev/releases
  WIN_TARGET: x86_64-pc-windows-msvc
  LINUX_TARGET: x86_64-unknown-linux-gnu

jobs:
  attach-bun:
    name: Tải Bun (Win + Linux) và đính vào release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Tải và kiểm tra checksum
        env:
          BUN_VERSION: ${{ inputs.bun-version }}
        run: |
          BUN_VERSION="${BUN_VERSION#bun-v}"
          BUN_VERSION="${BUN_VERSION#v}"
          case "$BUN_VERSION" in
            "" | latest) release="latest" ;;
            *)
              if [[ ! "$BUN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::Phiên bản Bun không hợp lệ: $BUN_VERSION"
                exit 1
              fi
              release="bun-v${BUN_VERSION}"
              ;;
          esac
          mkdir -p download dist
          cd download
          for name in \
            bun-windows-x64.zip \
            bun-windows-x64-baseline.zip \
            bun-linux-x64.zip \
            bun-linux-x64-baseline.zip \
            SHASUMS256.txt; do
            curl -fsSLO "${BUN_DOWNLOAD_URL}/${release}/${name}" --retry 5
          done
          grep -E '  bun-(windows|linux)-x64(-baseline)?\.zip$' SHASUMS256.txt > expected.txt
          test "$(wc -l < expected.txt)" -eq 4
          sha256sum -c expected.txt

          unzip -q bun-windows-x64.zip
          unzip -q bun-windows-x64-baseline.zip
          unzip -q bun-linux-x64.zip
          unzip -q bun-linux-x64-baseline.zip

          mv bun-windows-x64/bun.exe "../dist/bun-${WIN_TARGET}.exe"
          mv bun-windows-x64-baseline/bun.exe "../dist/bun-baseline-${WIN_TARGET}.exe"
          mv bun-linux-x64/bun "../dist/bun-${LINUX_TARGET}"
          mv bun-linux-x64-baseline/bun "../dist/bun-baseline-${LINUX_TARGET}"

      - name: Chạy thử và lấy phiên bản
        id: version
        run: |
          version="$("dist/bun-${WIN_TARGET}.exe" --version | tr -d '\r')"
          baseline="$("dist/bun-baseline-${WIN_TARGET}.exe" --version | tr -d '\r')"
          echo "bun: $version, bun-baseline: $baseline"
          if [[ "$version" != "$baseline" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Phiên bản không khớp hoặc không hợp lệ"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cập nhật manifest.json và checksums
        run: |
          node scripts/update-bun-manifest.mjs dist "${{ steps.version.outputs.version }}"
          cp "dist/bun-${WIN_TARGET}.exe" dist/bun.exe
          cp "dist/bun-baseline-${WIN_TARGET}.exe" dist/bun-baseline.exe
          cp "dist/bun-${LINUX_TARGET}" dist/bun
          cp "dist/bun-baseline-${LINUX_TARGET}" dist/bun-baseline

      - name: Đính vào release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          tag="${RELEASE_TAG:-$(node -p "require('./manifest.json').releaseTag")}"
          gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json checksums
          if git diff --cached --quiet; then
            echo "manifest.json không đổi"
            exit 0
          fi
          git commit -m "chore: attach bun ${{ steps.version.outputs.version }} (win + linux)"
          git push origin HEAD:main
